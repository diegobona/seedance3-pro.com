<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEEDANCE Blog 发布后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #editor[contenteditable="true"]:empty::before {
      content: attr(data-placeholder);
      color: #64748b;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold">SEEDANCE Blog 发布后台</h1>
      <p class="mt-2 text-sm text-slate-300">填写标题与内容，支持图文混排与粘贴图片。点击发布后会在本地直接生成 HTML 文章并更新 blog 列表、站点地图，然后自动推送到 GitHub。</p>
    </header>

    <section class="rounded-2xl border border-white/10 bg-slate-900/70 p-6">
      <div class="grid gap-4 md:grid-cols-2">
        <div class="md:col-span-2">
          <label for="title" class="mb-2 block text-sm font-medium">文章标题</label>
          <input id="title" type="text" class="w-full rounded-xl border border-white/15 bg-slate-950 px-4 py-3 text-sm focus:border-indigo-400 focus:outline-none" placeholder="例如：Seedance 3.0 Prompt Framework for E-commerce Ads">
        </div>
        <div>
          <label for="category" class="mb-2 block text-sm font-medium">分类</label>
          <select id="category" class="w-full rounded-xl border border-white/15 bg-slate-950 px-4 py-3 text-sm focus:border-indigo-400 focus:outline-none">
            <option>Tutorial</option>
            <option>Comparison</option>
            <option>Playbook</option>
            <option>Case Study</option>
          </select>
        </div>
        <div>
          <label for="excerpt" class="mb-2 block text-sm font-medium">摘要</label>
          <input id="excerpt" type="text" class="w-full rounded-xl border border-white/15 bg-slate-950 px-4 py-3 text-sm focus:border-indigo-400 focus:outline-none" placeholder="用于 blog 卡片与 meta description">
        </div>
      </div>

      <div class="mt-6">
        <label class="mb-2 block text-sm font-medium">正文内容（富文本编辑器）</label>
        <div class="rounded-xl border border-white/15 bg-slate-950">
          <div class="flex flex-wrap gap-2 border-b border-white/10 p-3">
            <button type="button" data-cmd="bold" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">加粗</button>
            <button type="button" data-cmd="italic" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">斜体</button>
            <button type="button" data-cmd="h2" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">H2</button>
            <button type="button" data-cmd="h3" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">H3</button>
            <button type="button" data-cmd="ul" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">无序列表</button>
            <button type="button" data-cmd="ol" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">有序列表</button>
            <button type="button" data-cmd="quote" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">引用</button>
            <button type="button" id="clear-format-btn" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs hover:border-indigo-300/50">清除格式</button>
          </div>
          <div id="editor" contenteditable="true" class="min-h-[420px] px-4 py-3 text-sm leading-7 outline-none" data-placeholder="直接输入正文内容；支持复制粘贴图片、文字和段落格式。"></div>
        </div>
        <p class="mt-2 text-xs text-slate-400">提示：可直接 Ctrl+V 粘贴截图或图片，发布时会自动转成文章图片文件。</p>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <button id="publish-btn" type="button" class="rounded-xl bg-indigo-500 px-5 py-3 text-sm font-semibold text-white hover:bg-indigo-400">发布文章并推送 GitHub</button>
        <a href="../blog.html" target="_blank" class="rounded-xl border border-white/20 px-5 py-3 text-sm font-semibold hover:border-white/40">查看 Blog</a>
      </div>
    </section>

    <section class="mt-6 rounded-2xl border border-white/10 bg-slate-900/70 p-6">
      <div class="flex items-center justify-between gap-3">
        <h2 class="text-lg font-semibold">已发布文章管理</h2>
        <button id="refresh-posts-btn" type="button" class="rounded-lg border border-white/20 px-4 py-2 text-xs font-semibold hover:border-white/40">刷新列表</button>
      </div>
      <div id="posts-list" class="mt-4 space-y-3"></div>
    </section>

    <section class="mt-6 rounded-2xl border border-white/10 bg-slate-900/70 p-6">
      <h2 class="text-lg font-semibold">执行日志</h2>
      <pre id="log" class="mt-3 h-64 overflow-auto rounded-xl border border-white/10 bg-slate-950 p-4 text-xs leading-6 text-slate-300"></pre>
    </section>
  </div>

  <script>
    const titleInput = document.getElementById("title");
    const categoryInput = document.getElementById("category");
    const excerptInput = document.getElementById("excerpt");
    const editor = document.getElementById("editor");
    const publishButton = document.getElementById("publish-btn");
    const refreshPostsButton = document.getElementById("refresh-posts-btn");
    const postsList = document.getElementById("posts-list");
    const clearFormatButton = document.getElementById("clear-format-btn");
    const logBox = document.getElementById("log");
    const toolbarButtons = document.querySelectorAll("[data-cmd]");

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logBox.textContent += `[${time}] ${message}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    toolbarButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const cmd = button.getAttribute("data-cmd");
        editor.focus();
        if (cmd === "h2" || cmd === "h3") {
          document.execCommand("formatBlock", false, cmd.toUpperCase());
          return;
        }
        if (cmd === "ul") {
          document.execCommand("insertUnorderedList");
          return;
        }
        if (cmd === "ol") {
          document.execCommand("insertOrderedList");
          return;
        }
        if (cmd === "quote") {
          document.execCommand("formatBlock", false, "BLOCKQUOTE");
          return;
        }
        document.execCommand(cmd);
      });
    });

    clearFormatButton.addEventListener("click", () => {
      editor.focus();
      document.execCommand("removeFormat");
    });

    editor.addEventListener("paste", (event) => {
      const items = event.clipboardData?.items || [];
      const imageItems = Array.from(items).filter((item) => item.type.startsWith("image/"));
      if (!imageItems.length) {
        return;
      }
      event.preventDefault();
      imageItems.forEach((item) => {
        const file = item.getAsFile();
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || "");
          insertHtmlAtCaret(`<figure class="mt-6 overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60"><img src="${dataUrl}" alt="Seedance pasted image" loading="lazy" class="h-64 w-full object-cover"><figcaption class="px-4 py-3 text-xs text-slate-400">Seedance pasted image</figcaption></figure><p><br></p>`);
        };
        reader.readAsDataURL(file);
      });
      log("已粘贴图片到编辑器。");
    });

    publishButton.addEventListener("click", async () => {
      const title = titleInput.value.trim();
      const content = normalizeEditorHtml(editor.innerHTML);
      if (!title || !content) {
        log("标题和正文不能为空。");
        return;
      }
      publishButton.disabled = true;
      publishButton.textContent = "发布中...";
      log("开始创建发布任务，本地服务将重试直到成功。");
      try {
        const response = await fetch("/api/publish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            excerpt: excerptInput.value.trim(),
            category: categoryInput.value,
            content
          })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          log(`发布失败：${result.message || "未知错误"}`);
          return;
        }
        log(`任务已创建：${result.jobId}`);
        await waitForJob(result.jobId);
        await loadPosts();
      } catch (error) {
        log(`发布失败：${error.message}`);
      } finally {
        publishButton.disabled = false;
        publishButton.textContent = "发布文章并推送 GitHub";
      }
    });

    async function waitForJob(jobId) {
      while (true) {
        await sleep(4000);
        const response = await fetch(`/api/job/${jobId}`, {
          method: "GET"
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          log(`查询任务失败：${result.message || "未知错误"}`);
          continue;
        }
        const job = result.job;
        log(`任务状态：${job.status}，尝试次数：${job.attempts}`);
        if (job.lastError) {
          log(`最近错误：${job.lastError}`);
        }
        if (job.status === "success") {
          const output = job.output || {};
          if (output.deleted) {
            log(`删除成功：${output.deleted}`);
          } else {
            log(`发布成功：${output.articleUrl || "已生成文章"}`);
          }
          break;
        }
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function insertHtmlAtCaret(html) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) {
        editor.innerHTML += html;
        return;
      }
      const range = selection.getRangeAt(0);
      range.deleteContents();
      const temp = document.createElement("div");
      temp.innerHTML = html;
      const fragment = document.createDocumentFragment();
      let node;
      let lastNode = null;
      while ((node = temp.firstChild)) {
        lastNode = fragment.appendChild(node);
      }
      range.insertNode(fragment);
      if (lastNode) {
        range.setStartAfter(lastNode);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      }
    }

    function normalizeEditorHtml(html) {
      const trimmed = String(html || "").trim();
      if (!trimmed || trimmed === "<br>" || trimmed === "<p><br></p>") {
        return "";
      }
      return trimmed;
    }

    refreshPostsButton.addEventListener("click", loadPosts);

    async function loadPosts() {
      postsList.innerHTML = `<p class="text-xs text-slate-400">加载中...</p>`;
      try {
        const response = await fetch("/api/posts");
        const result = await response.json();
        if (!response.ok || !result.success) {
          postsList.innerHTML = `<p class="text-xs text-rose-300">加载失败：${result.message || "未知错误"}</p>`;
          return;
        }
        renderPosts(result.posts || []);
      } catch (error) {
        postsList.innerHTML = `<p class="text-xs text-rose-300">加载失败：${error.message}</p>`;
      }
    }

    function renderPosts(posts) {
      if (!posts.length) {
        postsList.innerHTML = `<p class="text-xs text-slate-400">暂无文章。</p>`;
        return;
      }
      postsList.innerHTML = posts.map((post) => `
        <div class="rounded-xl border border-white/10 bg-slate-950/80 p-4">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <p class="text-xs font-medium uppercase tracking-wide text-indigo-200">${escapeHtml(post.category || "Tutorial")}</p>
              <p class="mt-1 text-sm font-semibold text-white break-all">${escapeHtml(post.title || "(No title)")}</p>
              <p class="mt-1 text-xs text-slate-400 break-all">${escapeHtml(post.fileName || "")}</p>
              <p class="mt-2 text-xs text-slate-300">${escapeHtml(post.excerpt || "")}</p>
            </div>
            <button type="button" data-file="${escapeAttr(post.fileName || "")}" class="delete-post-btn rounded-lg border border-rose-300/30 bg-rose-500/20 px-3 py-2 text-xs font-semibold text-rose-100 hover:bg-rose-500/35">删除</button>
          </div>
        </div>
      `).join("");
      const deleteButtons = postsList.querySelectorAll(".delete-post-btn");
      deleteButtons.forEach((button) => {
        button.addEventListener("click", async () => {
          const fileName = button.getAttribute("data-file") || "";
          if (!fileName) return;
          const ok = window.confirm(`确认删除文章 ${fileName} 吗？`);
          if (!ok) return;
          await deletePost(fileName, button);
        });
      });
    }

    async function deletePost(fileName, button) {
      button.disabled = true;
      const oldText = button.textContent;
      button.textContent = "删除中...";
      log(`开始删除文章：${fileName}`);
      try {
        const response = await fetch("/api/delete-post", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fileName })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          log(`删除失败：${result.message || "未知错误"}`);
          return;
        }
        log(`删除任务已创建：${result.jobId}`);
        await waitForJob(result.jobId);
        await loadPosts();
      } catch (error) {
        log(`删除失败：${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = oldText;
      }
    }

    function escapeHtml(input) {
      return String(input || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttr(input) {
      return escapeHtml(input).replaceAll("`", "");
    }

    loadPosts();
  </script>
</body>
</html>
